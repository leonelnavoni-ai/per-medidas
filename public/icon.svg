<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="driveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pdfRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Document Shape -->
  <path d="M140 100 H300 L372 172 V412 H140 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M140 100 H300 L372 172 V412 H140 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" opacity="0.2"/>
  
  <!-- Folder / Drive element -->
  <path d="M160 210 L230 140 L310 140 L240 210 Z" fill="#4285F4" opacity="0.9"/>
