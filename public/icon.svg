  <path d="M160 210 L230 330 L160 330 Z" fill="#F4B400" opacity="0.9"/>
  
  <!-- PDF Badge -->
  <rect x="230" y="270" width="160" height="96" rx="20" fill="url(#pdfRed)"/>
  <text x="310" y="336" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
  
  <!-- Accent Search Glass ring -->
  <circle cx="210" cy="340" r="48" fill="none" stroke="#60a5fa" stroke-width="14" opacity="0.9"/>
  <line x1="244" y1="374" x2="280" y2="410" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
